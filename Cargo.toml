[package]
name = "nyx-maps"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nyx-maps"
description = "Lightweight, native Linux desktop mapping application for Omarchy and Nyx"

[[bin]]
name = "nyx-maps"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gdk = { package = "gdk4", version = "0.11" }
gio = "0.22"
glib = "0.22"
cairo-rs = "0.22"
pangocairo = "0.22"
libshumate = { version = "0.8.1", features = ["gtk_v4_18", "v1_7"] }

nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
