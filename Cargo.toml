[package]
name = "nixe-maps"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nixe-maps"
description = "Lightweight, native Linux desktop mapping application for Omarchy and Nixe"

[[bin]]
name = "nixe-maps"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gdk = { package = "gdk4", version = "0.11" }
gio = "0.22"
glib = "0.22"
cairo-rs = "0.22"
pangocairo = "0.22"
libshumate = { version = "0.8.1", features = ["gtk_v4_18", "v1_7"] }

nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
